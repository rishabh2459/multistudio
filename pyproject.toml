# Workspace root. Not a package itself; it ties the Python members together
# and holds shared tool configuration (ruff, mypy, pytest).

[project]
name = "multicam-studio"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["multicam-engine"]

[tool.uv]
package = false

[tool.uv.sources]
multicam-engine = { workspace = true }

[tool.uv.workspace]
members = ["engine"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packaging/models", "samples"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "DTZ",      # no naive datetimes
  "PTH",      # prefer pathlib
  "N",        # naming
]

[tool.ruff.lint.isort]
known-first-party = ["multicam_engine"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "engine/src"
files = ["engine/src/multicam_engine", "tests", "scripts", "packaging/scripts"]
warn_unreachable = true

# SciPy ships no type information; treat it as untyped (results are cast at the call site).
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "accuracy: real-footage benchmarks (need samples/, slow). Run with: make test-accuracy",
]
