[project]
name = "multicam-api"
version = "0.1.0"
description = "Multicam Studio local backend: FastAPI + SQLite + Huey around multicam-engine."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "multicam-engine",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "huey>=2.5",
  "sse-starlette>=2.1",
]

[project.scripts]
multicam-api = "multicam_api.main:main"

[tool.uv.sources]
multicam-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicam_api"]
