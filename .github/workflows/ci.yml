name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests, schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run python packaging/scripts/fetch_models.py --only silero-vad
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not accuracy" --cov=multicam_engine --cov-report=term-missing
        env:
          MULTICAM_REQUIRE_FFMPEG: '1'
          MULTICAM_REQUIRE_VAD: '1'
      - run: uv run python scripts/export_schemas.py --check

  web:
    name: TypeScript (lint, format, types, generated types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @multicam/types generate:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @multicam/web test
      - run: pnpm --filter @multicam/web build
